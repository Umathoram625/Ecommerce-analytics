services:
  # Web Application (FastAPI + Static Frontend)
  - type: web
    name: ecommerce-sales-analytics
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-analytics-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  # Managed PostgreSQL Database on Render
  - name: ecommerce-analytics-db
    databaseName: ecommerce_sales
    user: dbuser
    plan: free
